name: Refresh offers and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: freecloud-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect official offers
        run: python scripts/update_offers.py
      - name: Save offer observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/offers.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh official cloud offers'
            git push
          fi
      - name: Build static site
        run: python scripts/build.py
      - name: Ensure llms.txt in Pages artifact
        run: mkdir -p dist && cp llms.txt dist/llms.txt
      - name: Ensure sitemap and robots in Pages artifact
        run: mkdir -p dist && cp sitemap.xml robots.txt dist/
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
